services:
  # ... (aquí podrían estar tus servicios de postgres y minio)

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    hostname: 'rabbitmq' # Importante para que el DNS de Docker funcione
    ports:
      - "5672:5672"  # Puerto para la comunicación de la aplicación
      - "15672:15672" # Puerto para la interfaz de gestión web
    environment:
      - RABBITMQ_DEFAULT_USER=rabbitadmin
      - RABBITMQ_DEFAULT_PASS=clave_rabbit_segura
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    networks:
      - ufrojobs-net

  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      - DB_HOST=postgres_db
    depends_on:
      - rabbitmq
      - postgres_db
    networks:
      - ufrojobs-net

  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ufrojobs-net

# ... (si tienes más servicios, asegúrate de que usen la misma red)

networks:
  ufrojobs-net:
    driver: bridge

volumes:
  postgres-data: